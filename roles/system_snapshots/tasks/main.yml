---
- name: Require read-only Fedora 45 snapshot auditing
  ansible.builtin.assert:
    that:
      - system_snapshots_audit_only | bool
      - ansible_facts['distribution'] == 'Fedora'
      - ansible_facts['distribution_major_version'] == '45'
    fail_msg: This role only supports read-only auditing of the existing Fedora 45 architecture.

- name: Read repository Dracut references
  ansible.builtin.set_fact:
    system_snapshots_references: >-
      {{ system_snapshots_references | default({}) | combine(
        {item: lookup('ansible.builtin.file', role_path ~ '/files/dracut/69overlayfs/' ~ item,
                      rstrip=false)}) }}
  loop: "{{ system_snapshots_dracut_files }}"

# Execute controller-side source directly: no helper is installed on the host.
# command runs in check mode too; the helper only reads files and invokes queries.
- name: Inspect snapshot policies and boot artifacts without changing them
  ansible.builtin.command:
    argv:
      - "{{ system_snapshots_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/audit.py') }}"
    stdin: >-
      {{ {'expected': system_snapshots_expected,
          'policy': system_snapshots_snapper_policy,
          'timers': system_snapshots_timers,
          'dracut_files': system_snapshots_dracut_files,
          'grub_settings': system_snapshots_grub_btrfs_settings,
          'kernel': ansible_facts['kernel'],
          'timeout': system_snapshots_command_timeout,
          'reference_files': system_snapshots_references} | to_json }}
  register: system_snapshots_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require a completed audit probe
  ansible.builtin.assert:
    that:
      - system_snapshots_probe.rc == 0
    fail_msg: >-
      Snapshot audit could not complete. Check Python, privileges and configured paths.
      {{ system_snapshots_probe.stderr | default('No diagnostic returned') }}

- name: Decode snapshot audit findings
  ansible.builtin.set_fact:
    system_snapshots_report: "{{ system_snapshots_probe.stdout | from_json }}"

- name: Report snapshot audit evidence and limitations
  ansible.builtin.debug:
    var: system_snapshots_report

- name: Require safe and consistent snapshot boot configuration
  ansible.builtin.assert:
    that:
      - system_snapshots_report.errors | length == 0
    fail_msg: >-
      Read-only snapshot audit failed; nothing was repaired.
      {{ system_snapshots_report.errors | join(' | ') }}
    success_msg: Static snapshot checks passed. Snapshot boot and persistent recovery remain untested.
