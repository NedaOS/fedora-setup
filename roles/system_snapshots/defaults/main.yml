---
system_snapshots_audit_only: true

system_snapshots_expected:
  snapper_config: root
  grub_btrfs_service: grub-btrfsd.service
  grub_config: /boot/grub2/grub.cfg
  dracut_module_dir: /usr/lib/dracut/modules.d/69overlayfs
  dracut_config: /etc/dracut.conf.d/20-overlayfs.conf
  grub_btrfs_config: /etc/default/grub-btrfs/config

# Files of the custom Dracut module; the repository copies live in files/dracut/69overlayfs/.
system_snapshots_dracut_files:
  - module-setup.sh
  - prepare-overlayfs.sh
  - mount-overlayfs.sh

# Exact line expected in system_snapshots_expected.dracut_config.
system_snapshots_dracut_config_line: 'add_dracutmodules+=" overlayfs "'

# Lines that must be present (exact, uncommented) in system_snapshots_expected.grub_btrfs_config.
system_snapshots_grub_btrfs_expected_lines:
  - GRUB_BTRFS_SNAPSHOT_KERNEL_PARAMETERS="rd.live.overlay.overlayfs=1"
  - GRUB_BTRFS_IGNORE_SPECIFIC_PATH=("@")
  - GRUB_BTRFS_IGNORE_PREFIX_PATH=("var/lib/docker" "@var/lib/docker" "@/var/lib/docker" "var/lib/containers" "@var/lib/containers" "@/var/lib/containers")
  - GRUB_BTRFS_GRUB_DIRNAME="/boot/grub2"
  - GRUB_BTRFS_BOOT_DIRNAME="/boot"
  - GRUB_BTRFS_SCRIPT_CHECK=grub2-script-check
