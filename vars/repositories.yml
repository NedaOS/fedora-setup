---
supported_fedora_releases:
  - "44"

copr_repositories:
  - name: lionheartp/Hyprland
  - name: lihaohong/yazi
  - name: mkocustos/grub-btrfs

rpmfusion:
  enabled: true

vendor_repositories:
  terra:
    enabled: true
    repo_id: terra
    description: Terra $releasever
    metalink: https://tetsudou.fyralabs.com/metalink?repo=terra$releasever&arch=$basearch
    gpg_key_url: https://repos.fyralabs.com/terra44/key.asc
    package: noctalia-greeter

  brave:
    enabled: true
    repo_id: brave-browser
    description: Brave Browser
    baseurl: https://brave-browser-rpm-release.s3.brave.com/$basearch
    gpg_key_url: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    package: brave-browser

  vscode:
    enabled: true
    repo_id: code
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpg_key_url: https://packages.microsoft.com/keys/microsoft.asc
    package: code
