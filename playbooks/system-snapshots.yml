---
- name: Audit Fedora snapshot boot configuration
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  gather_subset:
    - '!all'
    - '!min'
    - distribution
    - kernel

  tasks:
    - name: Ensure this playbook runs on Fedora
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Fedora'
          - ansible_facts['distribution_major_version'] == '45'
        fail_msg: "This playbook is intended for Fedora 45."

    - name: Audit snapshot boot configuration
      ansible.builtin.import_role:
        name: "{{ playbook_dir }}/../roles/system_snapshots"
