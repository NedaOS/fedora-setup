---
- name: Audit Fedora snapshot boot configuration
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  tasks:
    - name: Ensure this playbook runs on Fedora
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Fedora'
          - ansible_facts['distribution_major_version'] == '44'
        fail_msg: "This playbook is intended for Fedora 44."

    - name: Audit snapshot boot configuration
      ansible.builtin.import_role:
        name: system_snapshots
